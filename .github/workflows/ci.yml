name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npx turbo lint

      - name: Test
        run: npx turbo test

  build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Build all packages
        run: npx turbo build

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy PWA to staging
        run: echo "Deploy to staging CDN"
        # TODO: Deploy to Vercel/CloudFront staging

      - name: Deploy API to staging
        run: echo "Deploy API container to staging"
        # TODO: Build and push Docker image, deploy to ECS/GKE

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy PWA to production
        run: echo "Deploy to production CDN"
        # TODO: Deploy to Vercel/CloudFront production

      - name: Deploy API to production
        run: echo "Deploy API container to production"
        # TODO: Build and push Docker image, deploy to ECS/GKE
